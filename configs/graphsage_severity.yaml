# Severity generalization experiment (plan §29/§39): identical to
# configs/graphsage.yaml except split.strategy. Train on severity 1-3,
# test on severity 4-5 (the composition is fixed by the benchmark's own
# pre-generated splits/severity_split.csv -- see that file's comment).
dataset:
  benchmark_path: data/benchmark
  dataset_id: scm_v1_black_swan_seed43

prediction:
  target: supplier_disrupted
  horizon_periods: 4

features:
  rolling_windows: [4, 8, 12]
  min_history_periods: 12

split:
  strategy: severity
  generalization_val_frac: 0.15

model:
  name: hetero_graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.20
  aggregation: mean

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  class_weighting: balanced

threshold:
  policy: fixed
  value: 0.5
  target_value: 0.8

experiment:
  output_dir: experiments/classical_gnn
  seeds: [42, 43, 44, 45, 46]
