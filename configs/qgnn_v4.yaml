# QGNN-v4 experiment config (PENNYLANE_QGNN_IMPLEMENTATION_PLAN.md).
#
# dataset/prediction/features/split/model/training/threshold/experiment/seed
# describe the FROZEN encoder being reused (must match the config that
# originally produced experiments/classical_gnn/*_hetero_graphsage_seed<N>
# -- full feature mode, primary temporal split, hidden_dim=128,
# num_layers=2) -- read only to reconstruct that architecture and its
# preprocessing/split boundaries, never to retrain it.
dataset:
  benchmark_path: data/benchmark
  dataset_id: scm_v1_black_swan_seed43

prediction:
  target: supplier_disrupted
  horizon_periods: 4

features:
  rolling_windows: [4, 8, 12]
  min_history_periods: 12
  feature_mode: full

split:
  strategy: temporal
  train_frac: 0.7
  val_frac: 0.15

model:
  name: hetero_graphsage
  hidden_dim: 128
  num_layers: 2
  dropout: 0.20
  aggregation: mean

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  class_weighting: balanced

threshold:
  policy: fixed
  value: 0.5
  target_value: 0.8

experiment:
  output_dir: experiments/qgnn_v4
  seeds: [42, 43, 44, 45, 46]

seed: 42

# QGNN-v4-specific (PENNYLANE_QGNN_IMPLEMENTATION_PLAN.md sections 5-8).
# n_qubits/n_layers/ansatz are shared between HybridQuantumHead and
# MatchedCapacityClassicalHead so their parameter counts stay comparable
# (RQ-Q3, section 10).
quantum_v4:
  n_qubits: 6
  n_layers: 2
  # strongly_entangling | basic_entangler -- plan section 6's ablation table
  ansatz: strongly_entangling
  # backprop (exact, CPU-simulator only) | parameter-shift (required for
  # real hardware / shot-based simulation -- plan section 7/15's Phase Q7)
  diff_method: backprop
  # default.qubit | lightning.qubit
  device: default.qubit
