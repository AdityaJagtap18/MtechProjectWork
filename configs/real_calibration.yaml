# Phase 4: same as base.yaml, but with region risk calibrated from real
# public data (WGI + INFORM Risk Index) instead of synthetic archetypes --
# DATASET_DESIGN_REVIEW.md decision 3. Requires
# `python scripts/download_real_data.py` then `python scripts/calibrate.py`
# to have been run first (produces data/processed/region_risk_calibration.csv).

seed: 42

network:
  suppliers: 300
  procurement_orders: 2000
  materials: 100
  plants: 50
  products: 200
  regions: 20

topology:
  p_single_source_material: 0.3
  multi_source_min: 2
  multi_source_max: 5
  same_industry_bias: 0.8
  materials_per_plant_min: 5
  materials_per_plant_max: 20
  home_region_bias: 0.7

simulation:
  horizon_periods: 104
  periods_per_year: 52
  days_per_period: 7
  demand_seasonal_amplitude: 0.3
  demand_drift_std: 0.05
  initial_inventory_periods: 4.0
  reorder_threshold_periods: 1.5
  replenishment_multiplier: 2.0
  supplier_capacity_headroom: 1.5

real_data:
  use_real_region_calibration: true
  region_risk_table_path: data/processed/region_risk_calibration.csv
