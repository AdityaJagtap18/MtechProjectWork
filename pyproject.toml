[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-dataset"
version = "0.1.0"
description = "Reproducible synthetic supply-chain dataset generation framework for GNN/QGNN research."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "networkx>=3.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
notebook = ["jupyter>=1.0", "ipykernel>=6.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
